name: Production

on:
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Select version
    runs-on: ubuntu-latest
    # The selected version is written back into Cargo.toml: the release exists
    # in the tree it was built from, not only in the tag.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select next tag
        id: tag
        run: |
          latest=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest="$tag"
              break
            fi
          done < <(git tag --list "v*" --sort=-version:refname)

          if [[ -z "$latest" ]]; then
            next="v0.1.0"
          else
            [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
            next="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((10#${BASH_REMATCH[3]} + 1))"
          fi

          echo "tag=$next" >> "$GITHUB_OUTPUT"
      # The bot picked the version; the manifest follows it. Without this the
      # binary still reports the previous version (changelog popup reads it),
      # and the next release starts from a stale Cargo.toml.
      - name: Write the version into Cargo.toml
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          # main requires status checks, which the Actions token cannot satisfy
          # for a commit it is pushing right now. An admin token can, because
          # enforce_admins is off on the branch protection.
          PUSH_TOKEN: ${{ secrets.BIGGIE_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          current=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$current" = "$version" ]; then
            echo "Cargo.toml already at $version"
            exit 0
          fi
          sed -i -E "0,/^version = \".*\"/s//version = \"$version\"/" Cargo.toml
          # Cargo.lock repeats the crate version: rewrite the yopes block only,
          # so dependencies keep their pins.
          if [ -f Cargo.lock ]; then
            awk -v v="$version" '
              /^\[\[package\]\]/ { inside = 0 }
              /^name = "yopes"$/ { inside = 1 }
              inside && !done && /^version = / {
                print "version = \"" v "\""
                inside = 0
                done = 1
                next
              }
              { print }
            ' Cargo.lock > Cargo.lock.bumped
            mv Cargo.lock.bumped Cargo.lock
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): $TAG"
          token="${PUSH_TOKEN:-$ACTIONS_TOKEN}"
          git push "https://x-access-token:${token}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_REF_NAME}"
      - name: Record the bumped commit
        id: bump
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    # Windows is cross-compiled from Ubuntu with MinGW so the release does not
    # depend on the Windows hosted pool.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # macOS excluded: hosted arm64 runners queued indefinitely and starved
      # the release job; add the platform back once capacity is reliable.
      matrix:
        include:
          - platform: Linux-X64
            target: ""
          - platform: Windows-X64
            target: x86_64-pc-windows-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install MinGW
        if: matrix.target != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Build release
        env:
          YOPES_BUILD_VERSION: ${{ needs.prepare.outputs.tag }}
        run: cargo build --release --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Package tar.gz
        if: matrix.target == ''
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/yopes-${{ matrix.platform }}.tar.gz" yopes
      - name: Package zip
        if: matrix.target != ''
        run: |
          mkdir -p dist
          zip -j "dist/yopes-${{ matrix.platform }}.zip" "target/${{ matrix.target }}/release/yopes.exe"
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Tag the commit that already carries the bumped Cargo.toml.
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum yopes-* > SHA256SUMS
      - name: Publish GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # What's Changed: one bullet per merged PR, falling back to direct
          # commits, ending with the compare link against the previous tag.
          notes=notes.md
          echo "## What's Changed" > "$notes"

          # The checkout does not fetch tags; pull them for the range below.
          git fetch --tags -q origin

          # The tag being published does not exist yet; exclude it anyway so a
          # re-run of Production cannot compare against itself.
          prev=$(git tag --list 'v*' --sort=-version:refname | grep -v -- "^$TAG$" | head -1 || true)
          seen=0

          if [ -n "$prev" ]; then
            while read -r sha subject; do
              case "$subject" in
                *"pull request #"*" from "*)
                  num="${subject##*#}"; num="${num%% *}"
                  title=$(gh pr view "$num" --json title --jq .title)
                  author=$(gh pr view "$num" --json author --jq .author.login)
                  echo "- $title by @$author in #$num" >> "$notes"
                  seen=1
                  ;;
              esac
            done < <(git log --merges --format='%H %s' "$prev..$GITHUB_SHA")

            while read -r sha subject; do
              echo "- $subject ($(echo "$sha" | cut -c1-7))" >> "$notes"
              seen=1
            done < <(git log --no-merges --format='%H %s' "$prev..$GITHUB_SHA")

            if [ "$seen" = 0 ]; then
              echo "- No changes since $prev" >> "$notes"
            fi

            {
              echo ""
              echo "**Full Changelog:** https://github.com/$REPO/compare/$prev...$TAG"
            } >> "$notes"
          else
            echo "- Initial release" >> "$notes"
          fi

          gh release create "$TAG" dist/* --title "$TAG" --notes-file "$notes" \
            --target "${{ needs.prepare.outputs.sha }}"

  npm:
    name: Publish npm package
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          # trusted publishing needs npm >= 11.5.1, bundled with Node 24
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Syntax check
        run: |
          node --check npm/install.js
          node --check npm/bin/yopes.js
      - name: Publish
        working-directory: npm
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          npm version "${TAG#v}" --no-git-tag-version
          npm publish --access public

  notify:
    name: Notify Discord
    needs: [prepare, build, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.build.result == 'success' && needs.release.result == 'success'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Send webhook
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        if: env.WEBHOOK != ''
        run: |
          embeds='[]'
          if [ "$BUILD_RESULT" = success ] && [ "$RELEASE_RESULT" = success ]; then
            msg="✅ Production \`$TAG\` published: https://github.com/$REPO/releases/tag/$TAG"
            git fetch --tags -q origin
            prev=$(git tag --list 'v*' --sort=-version:refname | grep -v -- "^$TAG$" | head -1 || true)
            if [ -n "$prev" ]; then
              # Network graph: mermaid gitGraph rendered by mermaid.ink, sent as
              # a Discord embed image. Falls back to ASCII graph on render error.
              mmd='gitGraph'
              mmd+=$'\n  commit id: "start" tag: "'"$prev"'"'
              used=';'
              n=0; more=0
              while IFS=$'\t' read -r sha parents subject; do
                n=$((n+1))
                if [ "$n" -gt 30 ]; then more=$((more+1)); continue; fi
                case "$parents" in
                  *\ *)
                    num=$(printf '%s' "${subject##*#}" | tr -cd '[:digit:]')
                    br="${subject##* from }"
                    bid=$(printf '%s' "$br" | tr -c '[:alnum:]_-' '-' | sed 's/-\{2,\}/-/g; s/^-*//; s/-*$//' | cut -c1-16)
                    [ -z "$bid" ] && bid=pr
                    case ";$used;" in *";$bid;"*) bid="$bid-$n";; esac
                    used="$used;$bid"
                    mmd+=$'\n  branch '"$bid"$'\n  commit id: "'"$sha"'"'
                    mmd+=$'\n  checkout main\n  merge '"$bid"' tag: "#'"$num"'"'
                    ;;
                  *)
                    mmd+=$'\n  commit id: "'"$sha"'"'
                    ;;
                esac
              done < <(git log --reverse --format='%h%x09%p%x09%s' "$prev..HEAD")
              mmd+=$'\n  commit id: "'"$TAG"'" tag: "'"$TAG"'"'
              [ "$more" -gt 0 ] && mmd+=$'\n  commit id: "plus'"$more"'more" type: REVERSE'

              url="https://mermaid.ink/img/$(printf '%s' "$mmd" | base64 -w0 | tr '+/' '-_' | tr -d '=')"
              if curl -sf -o /dev/null --max-time 20 "$url"; then
                embeds=$(jq -n --arg t "$prev → $TAG" --arg u "$url" \
                  '[{title:$t, image:{url:$u}, color:3066993}]')
              else
                gtxt=$(git log --graph --oneline --first-parent "$prev..HEAD" | head -20)
                embeds=$(jq -n --arg d "```\n$gtxt\n```" '[{description:$d, color:3066993}]')
              fi
            fi
          else
            msg="❌ Production \`$TAG\` failed (build: $BUILD_RESULT, release: $RELEASE_RESULT): $RUN"
          fi
          curl -sf -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg content "$msg" --argjson embeds "$embeds" '{content:$content, embeds:$embeds}')"
